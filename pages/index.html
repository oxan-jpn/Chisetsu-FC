<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>池雪FC - Official Site</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/nav.css">
    <script src="../assets/js/main.js" defer></script>
    <script src="../assets/js/header.js" defer></script>
    <script src="../assets/js/nav.js" defer></script>
</head>
<body>

<!-- Header Section (will be loaded via JS from /components/header.html) -->
<div id="header-section">
    <!-- Header will be dynamically loaded here -->
</div>

<!-- Hero Section -->
<section id="hero">
    <div id="hero-image" style="width: 100%; height: 300px; background-color: #ddd;"></div>
    <h1>Chisetsu FC</h1>
    <p>One Team, One Goal</p>
</section>

<!-- News Section -->
<section id="news">
    <h2>お知らせ</h2>
    <ul id="news-list">
        <!-- News items will be dynamically loaded here -->
    </ul>
</section>

<!-- Upcoming Matches Section -->
<section id="upcoming-matches">
    <h2>直近の試合予定</h2>
    <table id="schedule-table">
        <!-- Schedule will be dynamically loaded here -->
    </table>
</section>

<!-- Recent Results Section -->
<section id="recent-results">
    <h2>直近の試合結果</h2>
    <table id="results-table">
        <!-- Results will be dynamically loaded here -->
    </table>
</section>

<!-- Back to Top Link -->
<a href="#" id="back-to-top">ページトップへ戻る</a>

<!-- Footer Section (will be loaded via JS from /components/footer.html) -->
<div id="footer-section">
    <!-- Footer will be dynamically loaded here -->
</div>

</body>
</html>
