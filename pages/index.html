<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>池雪FC一般部 - Official Site</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/nav.css">
    <script type="module" src="../assets/js/main.js"></script>
    <script type="module" src="../assets/js/header.js"></script>
</head>
<body>

<!-- Header Section (will be loaded via JS from /components/header.html) -->
<header id="site-header">
    <div class="header-inner">

        <!-- 左：ロゴや空白 -->
        <div class="header-left"></div>

        <!-- 中央：タイトル -->
        <h1 class="site-title">Chisetsu FC</h1>

        <!-- 右：ハンバーガー -->
        <button id="hamburger" aria-label="メニューを開閉">
            <span></span>
            <span></span>
            <span></span>
        </button>

    </div>

    <!-- スライドメニュー -->
    <nav id="side-nav">
        <ul>
            <li><a href="/index.html">ホーム</a></li>
            <li><a href="/pages/news.html">お知らせ</a></li>
            <li><a href="/pages/schedule.html">試合予定</a></li>
            <li><a href="/pages/results.html">試合結果</a></li>
            <li><a href="/pages/about.html">クラブについて</a></li>
        </ul>
    </nav>
</header>

<!-- Hero Section -->
<section id="hero">
    <div id="hero-image" style="width: 100%; height: 300px; background-color: #ddd;"></div>
    <h1>Chisetsu FC</h1>
    <p>One Team, One Goal</p>
</section>

<!-- News Section -->
<section id="news">
    <h2>お知らせ</h2>
    <ul id="news-list">
        <!-- News items will be dynamically loaded here -->
    </ul>
</section>

<!-- Upcoming Matches Section -->
<section id="upcoming-matches">
    <h2>直近の試合予定</h2>

    <table id="schedule-table">
        <thead>
            <tr>
                <th>日付</th>
                <th>キックオフ</th>
                <th>場所</th>
                <th>対戦相手</th>
            </tr>
        </thead>
        <tbody id="schedule-body"></tbody>
    </table>

    <button id="show-more" style="display:none;">もっと見る</button>
</section>

<!-- Recent Results Section -->
<section id="match-results">
    <h2>試合結果</h2>

    <table id="results-table">
        <thead>
            <tr>
                <th>日付</th>
                <th>結果</th>
                <th>対戦相手</th>
            </tr>
        </thead>
        <tbody id="results-body"></tbody>
    </table>
</section>


<!-- Back to Top Link -->
<a href="#" id="back-to-top">ページトップへ戻る</a>

<!-- Footer Section (will be loaded via JS from /components/footer.html) -->
<div id="footer-section">
    <!-- Footer will be dynamically loaded here -->
</div>

</body>
</html>
