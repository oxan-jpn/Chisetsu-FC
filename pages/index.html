<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="池雪FC - 公式サイト">
    <meta property="og:description" content="池雪FCの活動情報や試合予定・結果を掲載しています。">
    <meta property="og:image" content="https://oxan-jpn.github.io/Chisetsu-FC/assets/images/og-logo.png">
    <meta property="og:url" content="https://oxan-jpn.github.io/Chisetsu-FC/pages/index.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="池雪FC">
    <title>池雪FC一般部 - Official Site</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/nav.css">
    <script type="module" src="../assets/js/main.js"></script>
    <script type="module" src="../assets/js/header.js"></script>
    <script type="module" src="../assets/js/matches.js"></script>
    <script type="module" src="../assets/js/news.js"></script>
</head>
<body>

<!-- Header Section (will be loaded via JS from /components/header.html) -->
<header id="site-header">
    <div class="header-inner">

        <!-- 左：ロゴや空白 -->
        <div class="header-left"></div>

        <!-- 中央：タイトル -->
        <h1 class="site-title">Chisetsu FC</h1>
    </div>
</header>

<!-- Hero Section -->
<section id="hero">
    <img src="../assets/images/top-image.jpeg" />
    <h1>Chisetsu FC</h1>
    <p>One Team, One Goal</p>
</section>

<!-- News Section -->
<section id="news-section">
    <h2>お知らせ</h2>
    <ul id="news-list">
        <li id="news-loading">
            <div class="loading-spinner"></div>
        </li>
    </ul>
</section>


<!-- Upcoming Matches Section -->
<section id="upcoming-matches">
    <h2>直近の試合予定</h2>

    <table id="schedule-table">
        <thead>
            <tr>
                <th>日付</th>
                <th>キックオフ</th>
                <th>場所</th>
                <th>対戦相手</th>
            </tr>
        </thead>
        <tbody id="schedule-body">
            <tr id="schedule-loading">
                <td colspan="4">
                    <div class="loading-spinner"></div>
                </td>
            </tr>
        </tbody>

    </table>

    <button id="show-more" style="display:none;">もっと見る</button>
</section>

<!-- Recent Results Section -->
<section id="match-results">
    <h2>試合結果</h2>

    <table id="results-table">
        <thead>
            <tr>
                <th>日付</th>
                <th>結果</th>
                <th>対戦相手</th>
            </tr>
        </thead>
        <tbody id="results-body">
            <tr id="results-loading">
                <td colspan="3">
                    <div class="loading-spinner"></div>
                </td>
            </tr>
        </tbody>
    </table>
</section>

<section id="contact">
    <h2>お問い合わせ</h2>
    <p>
        チームの活動についてのお問い合わせは、メールにて承っています！<br>
        <a href="mailto:chisetsufc.topteam@gmail.com" class="contact-mail">
            chisetsufc.topteam@gmail.com
        </a>
    </p>
</section>



<!-- Back to Top Link -->
<a href="#" id="back-to-top">ページトップへ戻る</a>

<!-- Footer Section (will be loaded via JS from /components/footer.html) -->
<footer id="site-footer">
    <div class="footer-instagram">
        <a href="https://www.instagram.com/your_account/" target="_blank" class="instagram-link">
            <img src="../assets/icons/instagramIcon.jpeg" alt="Instagram" class="instagram-icon">
            <span class="instagram-text">Instagram をフォローして最新情報をチェック</span>
        </a>
    </div>
</footer>

</body>
</html>
