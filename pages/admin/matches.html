<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>試合管理</title>

  <link rel="stylesheet" href="../../assets/css/admin-matches.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<a href="/Chisetsu-FC/pages/admin/top.html" class="back-button top">← 戻る</a>

  <!-- トースト -->
  <div id="toast" class="toast" aria-live="polite"></div>

  <div class="container">
    <h2>試合管理</h2>

    <!-- 年度選択 -->
    <label for="yearSelect">年度を選択</label>
    <select id="yearSelect"></select>

    <!-- モード選択 -->
    <fieldset class="mode-fieldset">
      <legend>操作を選択</legend>

      <label>
        <input type="radio" name="mode" value="create">
        試合予定入力
      </label>

      <label>
        <input type="radio" name="mode" value="edit">
        試合予定修正
      </label>

      <label>
        <input type="radio" name="mode" value="result">
        試合結果入力
      </label>
    </fieldset>

    <!-- ============================
         ① 試合予定入力（新規）
    ============================= -->
    <section id="createSection" class="form-section" hidden>
      <h3>試合予定入力</h3>

      <label for="createDate">試合日（必須）</label>
      <input id="createDate" type="date">

      <label for="createKickoff">キックオフ（必須）</label>
      <input id="createKickoff" type="time">

      <label for="createOpponent">対戦相手（必須）</label>
<input id="createOpponent" type="text">

      <label for="createLocation">会場（必須）</label>
      <input id="createLocation" type="text">

      <button id="createSubmit" type="button">登録する</button>
    </section>

    <!-- ============================
         ② 試合予定修正
    ============================= -->
    <section id="editSection" class="form-section" hidden>
      <h3>試合予定修正</h3>

      <label for="editSelect">修正する試合を選択</label>
      <select id="editSelect"></select>

      <label for="editDate">試合日（必須）</label>
      <input id="editDate" type="date">

      <label for="editKickoff">キックオフ（必須）</label>
      <input id="editKickoff" type="time">

      <label for="editOpponent">対戦相手（必須）</label>
<input id="editOpponent" type="text">

      <label for="editLocation">会場（必須）</label>
      <input id="editLocation" type="text">

      <button id="editSubmit" type="button">更新する</button>
    </section>

    <!-- ============================
         ③ 試合結果入力（新規）
    ============================= -->
    <section id="resultSection" class="form-section" hidden>
      <h3>試合結果入力</h3>

      <label for="resultSelect">結果を入力する試合を選択</label>
      <select id="resultSelect"></select>

      <label for="resultScoreFor">得点（必須）</label>
      <input id="resultScoreFor" type="number" min="0">

      <label for="resultScoreAgainst">失点（必須）</label>
      <input id="resultScoreAgainst" type="number" min="0">

      <label for="resultResult">結果（必須）</label>
      <select id="resultResult">
        <option value="">選択してください</option>
        <option value="win">勝ち</option>
        <option value="draw">引き分け</option>
        <option value="lose">負け</option>
      </select>

      <button id="resultSubmit" type="button">結果を登録する</button>
    </section>

    <p id="inlineMessage" class="inline-message" aria-live="polite"></p>
  </div>

  <!-- モーダル（削除は今回使わないが構造は残す） -->
  <div id="modalOverlay" class="modal-overlay">
    <div class="modal">
      <h3>確認</h3>
      <p id="modalTitle" class="modal-title"></p>
      <div class="modal-actions">
        <button id="modalConfirm" type="button" class="danger">OK</button>
        <button id="modalCancel" type="button" class="secondary">キャンセル</button>
      </div>
    </div>
  </div>
<a href="/Chisetsu-FC/pages/admin/top.html" class="back-button bottom">← 戻る</a>
  <script src="../../assets/js/admin-matches.js" defer></script>
</body>
</html>
